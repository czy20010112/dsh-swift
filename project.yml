# XcodeGen 工程描述。生成出来的 DshApp.xcodeproj 不入库（.gitignore 已忽略 *.xcodeproj）：
# pbxproj 是机器生成的大文件，合并冲突几乎无法人工解决，而这份 yml 才是可评审的事实来源。
#
# 生成：brew install xcodegen && xcodegen generate
name: DshApp

options:
  bundleIdPrefix: io.github.dshswift
  deploymentTarget:
    # 目标设备是 iOS 15.3.1，必须 ≤ 15.3；取 15.0 与 Package.swift 的 .iOS(.v15) 对齐。
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  # 仓库根就是那个 SwiftPM 包。App 只作为它的消费者存在，
  # 三个核心库自己不知道 App 的存在——UIKit/SwiftUI 只出现在 App/ 下。
  dsh-swift:
    path: .
    group: Packages

targets:
  DshApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # 样例会话：一份脱敏后的真实会话，和 Tests/Fixtures/v4-01.json 同一份。
      # 让渲染层在没有 host 时也能在真机上验收。
      - path: App/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dshswift.app
        PRODUCT_NAME: DshApp
        INFOPLIST_FILE: App/Info.plist
        # Info.plist 是手写入库的，不让 Xcode 再合成一份，否则两份键会互相覆盖。
        GENERATE_INFOPLIST_FILE: NO
        # 语言模式用 5：核心库在 Linux CI 上按 5.9 工具链语义写，App 不先跳 Swift 6 严格并发。
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 只出 arm64 真机包；iPhone 13 不需要别的架构。
        ARCHS: arm64
    dependencies:
      - package: dsh-swift
        product: DshProtocol
      - package: dsh-swift
        product: DshSession
      - package: dsh-swift
        product: DshPresenter
    # 显式生成共享 scheme。CI 是干净 checkout，没有 Xcode GUI 帮忙自动建 scheme，
    # 不写这一行 `-scheme DshApp` 在部分 Xcode 版本上会找不到。
    scheme: {}
